name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The launcher, under Ubuntu's sh (dash)
      - run: sh scripts/test-launch.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t retro-board:ci .
      # The launcher again under Alpine's BusyBox sh, the strictest common one
      - run: docker run --rm -v "$PWD:/repo:ro" alpine:3.20 sh /repo/scripts/test-launch.sh

  # The public demo at retro.ryan-brock.com: the same web app on GitHub Pages. There's no API there, so the app
  # starts in demo mode with sample data saved in each visitor's browser.
  demo:
    runs-on: ubuntu-latest
    needs: test
    # One deploy at a time; a newer push replaces one still running (two at once collide on gh-pages)
    concurrency:
      group: demo-deploy
      cancel-in-progress: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @retro/web
      # GitHub Pages serves 404.html for unknown paths, so deep links like /boards/<id> still load the app
      - run: cp apps/web/dist/browser/index.html apps/web/dist/browser/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist/browser
          cname: retro.ryan-brock.com
