<!doctype html>
<html lang="en" data-beasties-container>
<head>
  <meta charset="utf-8">
  <title>Retro Board</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Self-hosted team retrospectives">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Paint the saved theme before Angular boots so there is no flash of the wrong colors.
    (function () {
      try {
        // your own theme, else the site's default theme
        var t = JSON.parse(localStorage.getItem('retro-board-theme') || localStorage.getItem('retro-board-site-theme') || 'null');
        if (!t || !t.tokens) return;
        var map = { bg: '--bg', surface: '--surface', surface2: '--surface-2', text: '--text', muted: '--muted',
          border: '--border', accent: '--accent', accentText: '--accent-text', danger: '--danger' };
        for (var k in map) if (/^#[0-9a-f]{6}$/i.test(t.tokens[k])) document.documentElement.style.setProperty(map[k], t.tokens[k]);
      } catch (e) {}
    })();
  </script>
<style>:root{--bg:#f4f5f7;--surface:#ffffff;--surface-2:#eef0f3;--text:#1f2328;--muted:#5f6b7a;--border:#d8dde3;--accent:#3b5bdb;--accent-text:#ffffff;--danger:#d6336c;--danger-text:#ffffff;--radius:10px;--radius-sm:6px;--shadow:0 1px 2px rgb(0 0 0 / .06), 0 2px 8px rgb(0 0 0 / .05);--shadow-lg:0 10px 40px rgb(0 0 0 / .25);--font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--mono:ui-monospace, "Cascadia Code", Consolas, monospace;--column-width:280px;color-scheme:light}@media(prefers-color-scheme:dark){:root{--bg:#16181d;--surface:#20232a;--surface-2:#2a2e37;--text:#e6e8eb;--muted:#9aa3ae;--border:#363b46;--accent:#748ffc;--accent-text:#0b0d12;--danger:#f06595;color-scheme:dark}}*,*:before,*:after{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}@media(max-width:720px){:root{--column-width:86vw}body:has(.sidebar){overflow:hidden}}@media print{body{background:#fff!important;color:#000!important}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}body:has(.column-focus-backdrop){overflow:hidden}</style><link rel="stylesheet" href="styles-2SGBTQAV.css" media="print" data-beasties-media="all"><noscript><link rel="stylesheet" href="styles-2SGBTQAV.css"></noscript></head>

<script src="main-3KQJSPGB.js" type="module"></script><script>document.querySelectorAll('link[data-beasties-media]').forEach(function(l){l.media=l.getAttribute('data-beasties-media');l.removeAttribute('data-beasties-media')})</script></body>
</html>
