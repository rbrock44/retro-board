# docker compose up -d --build   (or ./launch.sh / launch.cmd, which also creates .env for you)
#
# Settings come from .env (copy .env.example). Sign-in providers come from config/auth.yaml
# (copy config/auth.example.yaml). Neither file is required to try it out.

services:
  app:
    build: .
    image: retro-board:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://retro:${POSTGRES_PASSWORD:-retro}@db:5432/retro
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PORT: 8080
    volumes:
      - uploads:/data
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retro}
      POSTGRES_DB: retro
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retro"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional S3-compatible storage for uploads: docker compose --profile s3 up -d
  # then set STORAGE_DRIVER=s3 and the S3_* values in .env (see .env.example).
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-retro}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-retro-secret}
    ports:
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  db:
  uploads:
  minio:
